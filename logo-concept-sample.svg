<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Nimboni Farm logo concept</title>
  <desc id="desc">A lime slice and leaf emblem beside the Nimboni Farm wordmark, shown on dark and paper backgrounds.</desc>
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff09c"/>
      <stop offset="1" stop-color="#9fbe45"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fbb57"/>
      <stop offset="1" stop-color="#315d32"/>
    </linearGradient>
    <g id="mark-light">
      <circle cx="46" cy="46" r="30" fill="none" stroke="url(#lime)" stroke-width="5"/>
      <path d="M46 18v56M18 46h56M26 26l40 40M66 26L26 66" stroke="#cfe58b" stroke-width="2" opacity=".7"/>
      <path d="M58 31c12-18 30-19 39-16-2 16-11 29-32 32" fill="url(#leaf)"/>
      <path d="M59 45c12-10 23-18 36-25" fill="none" stroke="#dff09c" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="mark-dark">
      <circle cx="46" cy="46" r="30" fill="none" stroke="#6d9e46" stroke-width="5"/>
      <path d="M46 18v56M18 46h56M26 26l40 40M66 26L26 66" stroke="#a8c48a" stroke-width="2" opacity=".8"/>
      <path d="M58 31c12-18 30-19 39-16-2 16-11 29-32 32" fill="url(#leaf)"/>
      <path d="M59 45c12-10 23-18 36-25" fill="none" stroke="#4c7a34" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="520" fill="#f8f3e9"/>
  <rect x="38" y="38" width="1124" height="190" rx="18" fill="#14251a"/>
  <rect x="38" y="258" width="1124" height="224" rx="18" fill="#fffdf8" stroke="#d8cdbb"/>

  <text x="76" y="80" fill="#a8c48a" font-family="Inter, sans-serif" font-size="14" letter-spacing="3">HERO / TRANSPARENT HEADER</text>
  <g transform="translate(90 112) scale(.72)"><use href="#mark-light"/></g>
  <text x="180" y="163" fill="#f8f3e9" font-family="Georgia, serif" font-size="46" letter-spacing="-1.5">Nimboni</text>
  <text x="392" y="163" fill="#b9cf3f" font-family="Inter, sans-serif" font-size="20" font-weight="600">.farm</text>
  <text x="180" y="189" fill="#a8c48a" font-family="Inter, sans-serif" font-size="11" letter-spacing="2.5">LIME • LAND • LEARNING</text>

  <text x="76" y="300" fill="#5c7566" font-family="Inter, sans-serif" font-size="14" letter-spacing="3">SCROLLED / PAPER HEADER</text>
  <g transform="translate(90 332) scale(.72)"><use href="#mark-dark"/></g>
  <text x="180" y="383" fill="#14251a" font-family="Georgia, serif" font-size="46" letter-spacing="-1.5">Nimboni</text>
  <text x="392" y="383" fill="#4c7a34" font-family="Inter, sans-serif" font-size="20" font-weight="600">.farm</text>
  <text x="180" y="409" fill="#5c7566" font-family="Inter, sans-serif" font-size="11" letter-spacing="2.5">LIME • LAND • LEARNING</text>

  <g transform="translate(760 105)">
    <text x="0" y="0" fill="#a8c48a" font-family="Inter, sans-serif" font-size="12" letter-spacing="2">NAVBAR SCALE</text>
    <rect x="0" y="22" width="330" height="64" rx="32" fill="#0f1d14" stroke="#6d9e46"/>
    <g transform="translate(14 30) scale(.36)"><use href="#mark-light"/></g>
    <text x="75" y="62" fill="#f8f3e9" font-family="Georgia, serif" font-size="25">Nimboni</text>
    <text x="187" y="62" fill="#b9cf3f" font-family="Inter, sans-serif" font-size="12" font-weight="600">.farm</text>
  </g>
  <text x="760" y="430" fill="#5c7566" font-family="Inter, sans-serif" font-size="12">Concept only • no production files changed</text>
</svg>
