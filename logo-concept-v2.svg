<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Nimboni Farm logo concept v2</title>
  <desc id="desc">A refined lime cross-section with a leaf growing from it, paired with the existing Nimboni Farm wordmark.</desc>
  <defs>
    <linearGradient id="limeSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ef98"/>
      <stop offset="1" stop-color="#78a83f"/>
    </linearGradient>
    <linearGradient id="limeCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7bd"/>
      <stop offset="1" stop-color="#b7d45a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9ce68"/>
      <stop offset="1" stop-color="#2f6033"/>
    </linearGradient>
    <g id="emblem-light">
      <circle cx="43" cy="50" r="28" fill="url(#limeSkin)" opacity=".95"/>
      <circle cx="43" cy="50" r="22" fill="url(#limeCore)"/>
      <path d="M43 28v44M21 50h44M27.4 34.4l31.2 31.2M58.6 34.4 27.4 65.6" stroke="#6d9e46" stroke-width="1.4" opacity=".75"/>
      <circle cx="43" cy="50" r="4" fill="#5f8b37" opacity=".75"/>
      <path d="M47 29C53 13 67 6 82 10c-1 16-10 29-31 34" fill="url(#leaf)"/>
      <path d="M49 39c11-9 21-17 31-24" fill="none" stroke="#dff09c" stroke-width="2" stroke-linecap="round"/>
      <path d="M25 74c8 5 18 7 29 5" fill="none" stroke="#9fbe45" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g id="emblem-dark">
      <circle cx="43" cy="50" r="28" fill="url(#limeSkin)" opacity=".95"/>
      <circle cx="43" cy="50" r="22" fill="#e7efac"/>
      <path d="M43 28v44M21 50h44M27.4 34.4l31.2 31.2M58.6 34.4 27.4 65.6" stroke="#6d9e46" stroke-width="1.4" opacity=".75"/>
      <circle cx="43" cy="50" r="4" fill="#5f8b37" opacity=".75"/>
      <path d="M47 29C53 13 67 6 82 10c-1 16-10 29-31 34" fill="url(#leaf)"/>
      <path d="M49 39c11-9 21-17 31-24" fill="none" stroke="#315d32" stroke-width="2" stroke-linecap="round"/>
      <path d="M25 74c8 5 18 7 29 5" fill="none" stroke="#4c7a34" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1200" height="560" fill="#f8f3e9"/>
  <rect x="38" y="38" width="1124" height="205" rx="20" fill="#14251a"/>
  <rect x="38" y="273" width="1124" height="249" rx="20" fill="#fffdf8" stroke="#d8cdbb"/>

  <text x="78" y="82" fill="#a8c48a" font-family="Inter, sans-serif" font-size="14" letter-spacing="3">CONCEPT 02 / LIME AS THE HERO</text>
  <g transform="translate(91 103) scale(.78)"><use href="#emblem-light"/></g>
  <text x="180" y="168" fill="#f8f3e9" font-family="Georgia, serif" font-size="48" letter-spacing="-1.5">Nimboni</text>
  <text x="395" y="168" fill="#b9cf3f" font-family="Inter, sans-serif" font-size="20" font-weight="600">.farm</text>
  <text x="180" y="195" fill="#a8c48a" font-family="Inter, sans-serif" font-size="11" letter-spacing="2.5">LIME • LAND • LEARNING</text>

  <text x="78" y="317" fill="#5c7566" font-family="Inter, sans-serif" font-size="14" letter-spacing="3">PAPER HEADER / SAME WORDMARK</text>
  <g transform="translate(91 343) scale(.78)"><use href="#emblem-dark"/></g>
  <text x="180" y="411" fill="#14251a" font-family="Georgia, serif" font-size="48" letter-spacing="-1.5">Nimboni</text>
  <text x="395" y="411" fill="#4c7a34" font-family="Inter, sans-serif" font-size="20" font-weight="600">.farm</text>
  <text x="180" y="438" fill="#5c7566" font-family="Inter, sans-serif" font-size="11" letter-spacing="2.5">LIME • LAND • LEARNING</text>

  <g transform="translate(775 100)">
    <text x="0" y="0" fill="#a8c48a" font-family="Inter, sans-serif" font-size="12" letter-spacing="2">NAVBAR SCALE</text>
    <rect x="0" y="22" width="315" height="67" rx="34" fill="#0f1d14" stroke="#6d9e46"/>
    <g transform="translate(15 28) scale(.4)"><use href="#emblem-light"/></g>
    <text x="78" y="65" fill="#f8f3e9" font-family="Georgia, serif" font-size="25">Nimboni</text>
    <text x="190" y="65" fill="#b9cf3f" font-family="Inter, sans-serif" font-size="12" font-weight="600">.farm</text>
  </g>
  <text x="775" y="478" fill="#5c7566" font-family="Inter, sans-serif" font-size="12">Preview only • production logo unchanged</text>
</svg>
